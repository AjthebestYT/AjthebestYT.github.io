<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Games – Learning V4</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0d0f;
      --surface: #16161a;
      --surface2: #1e1e24;
      --accent: #7c6af7;
      --accent2: #a78bfa;
      --text: #e8e8f0;
      --muted: #6b6b80;
      --radius: 14px;
      --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    html, body {
      height: 100%;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    .wrapper {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* Top bar */
    .topbar {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 10px 20px;
      background: var(--surface);
      border-bottom: 1px solid rgba(255,255,255,0.05);
      flex-shrink: 0;
      z-index: 10;
    }

    .topbar-logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: -0.3px;
      text-decoration: none;
    }

    .topbar-logo .dot {
      width: 26px;
      height: 26px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      color: white;
    }

    .topbar-logo span {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .topbar-divider {
      width: 1px;
      height: 20px;
      background: rgba(255,255,255,0.08);
    }

    .topbar-section {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .topbar-spacer { flex: 1; }

    .view-toggle {
      display: flex;
      gap: 6px;
    }

    .view-btn {
      padding: 5px 14px;
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid rgba(255,255,255,0.08);
      background: transparent;
      color: var(--muted);
      transition: all var(--transition);
    }

    .view-btn.active,
    .view-btn:hover {
      background: rgba(124, 106, 247, 0.15);
      border-color: rgba(124, 106, 247, 0.3);
      color: var(--accent2);
    }

    /* Frame area */
    .frame-area {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    .game-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      transition: opacity 0.3s ease;
    }

    .game-frame.hidden {
      display: none;
    }

    /* Loading overlay */
    .loading-overlay {
      position: absolute;
      inset: 0;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 10;
      transition: opacity 0.4s ease;
    }

    .loading-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loading-spinner {
      width: 38px;
      height: 38px;
      border: 3px solid rgba(124, 106, 247, 0.2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-text {
      font-size: 0.85rem;
      color: var(--muted);
      font-weight: 500;
    }

    .topbar-badge {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 99px;
      background: rgba(124, 106, 247, 0.15);
      color: var(--accent2);
      border: 1px solid rgba(124, 106, 247, 0.2);
    }
  </style>
</head>
<body>

<div class="wrapper">

  <!-- Top bar -->
  <div class="topbar">
    <div class="topbar-logo">
      <div class="dot">&#9670;</div>
      <span>Learning V4</span>
    </div>
    <div class="topbar-divider"></div>
    <div class="topbar-section">
      &#127918; Games
    </div>
    <div class="topbar-spacer"></div>

    <!-- Toggle between Portal (browse) and AIO (play) -->
    <div class="view-toggle">
      <button class="view-btn active" id="btn-portal" onclick="switchView('portal')">Browse</button>
      <button class="view-btn" id="btn-aio" onclick="switchView('aio')">Now Playing</button>
    </div>

    <div class="topbar-badge">CloudMoon</div>
  </div>

  <!-- Frame area -->
  <div class="frame-area">

    <div class="loading-overlay" id="loader">
      <div class="loading-spinner"></div>
      <div class="loading-text">Loading CloudMoon...</div>
    </div>

    <!-- Portal: game browser -->
    <iframe
      id="frame-portal"
      class="game-frame"
      src="portal-2604131056.html"
      allowfullscreen
      allow="autoplay; fullscreen; microphone; camera"
    ></iframe>

    <!-- AIO: all-in-one game player -->
    <iframe
      id="frame-aio"
      class="game-frame hidden"
      src="main-2604131056.html"
      allowfullscreen
      allow="autoplay; fullscreen; microphone; camera"
    ></iframe>

  </div>
</div>

<script>
  const loader = document.getElementById('loader');
  const framePortal = document.getElementById('frame-portal');
  const frameAio = document.getElementById('frame-aio');
  const btnPortal = document.getElementById('btn-portal');
  const btnAio = document.getElementById('btn-aio');

  let portalLoaded = false;
  let aioLoaded = false;

  // Hide loader once portal loads
  framePortal.addEventListener('load', () => {
    portalLoaded = true;
    setTimeout(() => loader.classList.add('hidden'), 400);
  });

  frameAio.addEventListener('load', () => {
    aioLoaded = true;
  });

  function switchView(view) {
    if (view === 'portal') {
      framePortal.classList.remove('hidden');
      frameAio.classList.add('hidden');
      btnPortal.classList.add('active');
      btnAio.classList.remove('active');
    } else {
      frameAio.classList.remove('hidden');
      framePortal.classList.add('hidden');
      btnAio.classList.add('active');
      btnPortal.classList.remove('active');

      // Show loader briefly if AIO hasn't loaded yet
      if (!aioLoaded) {
        loader.classList.remove('hidden');
        frameAio.addEventListener('load', () => {
          setTimeout(() => loader.classList.add('hidden'), 400);
        }, { once: true });
      }
    }
  }

  // Listen for messages from portal to auto-switch to AIO when a game launches
  window.addEventListener('message', (e) => {
    if (e.data && typeof e.data === 'string') {
      try {
        const data = JSON.parse(e.data);
        if (data.start_cloud_game === true) {
          switchView('aio');
        } else if (data.start_cloud_game === false) {
          switchView('portal');
        }
      } catch {}
    }
  });
</script>

</body>
</html>
