<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Magnificent Link</title>

<style>
  body {
    background: radial-gradient(circle, #1a1a1a, #000000);
    color: white;
    text-align: center;
    font-family: 'Trebuchet MS', sans-serif;
    padding-top: 80px;
  }

  h1 {
    font-size: 3.5em;
    background: linear-gradient(90deg, #ff00ff, #00eaff, #ffea00);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shine 4s linear infinite;
  }

  @keyframes shine {
    0% { filter: drop-shadow(0 0 10px #ff00ff); }
    33% { filter: drop-shadow(0 0 10px #00eaff); }
    66% { filter: drop-shadow(0 0 10px #ffea00); }
    100% { filter: drop-shadow(0 0 10px #ff00ff); }
  }

  a {
    display: inline-block;
    margin-top: 40px;
    padding: 15px 30px;
    font-size: 1.5em;
    color: white;
    text-decoration: none;
    border-radius: 12px;
    background: linear-gradient(135deg, #ff00ff, #6a00ff, #00eaff);
    box-shadow: 0 0 20px #ff00ff;
    transition: 0.3s;
  }

  a:hover {
    transform: scale(1.15);
    box-shadow: 0 0 35px #00eaff;
  }
</style>
</head>

<body>
  <h1>✨ Step Into the Magnificent Realm ✨</h1>
  <a href="https://docs.google.com/forms/d/e/1FAIpQLSdYD3PPEmgrf1-azr_9EhBMYfcFMNQzPfuIgJGxq6w9R6zLug/viewform?usp=header" target="_blank">
    ➤ Enter the Form of Destiny
  </a>
</body>
</html>
